<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- クリップ領域 (1200x630) -->
    <clipPath id="canvasClip">
      <rect width="1200" height="630" />
    </clipPath>

    <!-- 太陽・月の立体ドロップシャドウ -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>

    <!-- 雲のドロップシャドウ -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e4b7a" flood-opacity="0.18" />
    </filter>

    <!-- 太陽の立体グラデーション（黄色め・ブライトイエロー） -->
    <linearGradient id="sunBody" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#fff36b" />
      <stop offset="55%" stop-color="#ffe01b" />
      <stop offset="100%" stop-color="#edc300" />
    </linearGradient>

    <!-- 月の立体グラデーション -->
    <linearGradient id="moonBody" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#f4f7fb" />
      <stop offset="60%" stop-color="#dfe5ef" />
      <stop offset="100%" stop-color="#c2cbd9" />
    </linearGradient>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- =========================================================================
         1. 24分割（1時間 = 幅50px）の段階的カラーバンド（0時〜23時）
         ========================================================================= -->
    <g id="skyBands24">
      <rect x="0"    y="0" width="50" height="630" fill="#161b24" /> <!-- 00時 -->
      <rect x="50"   y="0" width="50" height="630" fill="#191f2a" /> <!-- 01時 -->
      <rect x="100"  y="0" width="50" height="630" fill="#1e2532" /> <!-- 02時 -->
      <rect x="150"  y="0" width="50" height="630" fill="#252d3d" /> <!-- 03時 -->
      <rect x="200"  y="0" width="50" height="630" fill="#3b415e" /> <!-- 04時 -->
      <rect x="250"  y="0" width="50" height="630" fill="#7d5873" /> <!-- 05時 -->
      <rect x="300"  y="0" width="50" height="630" fill="#d68763" /> <!-- 06時 -->
      <rect x="350"  y="0" width="50" height="630" fill="#8292a8" /> <!-- 07時 -->
      <rect x="400"  y="0" width="50" height="630" fill="#4f8cc4" /> <!-- 08時 -->
      <rect x="450"  y="0" width="50" height="630" fill="#5796cf" /> <!-- 09時 -->
      <rect x="500"  y="0" width="50" height="630" fill="#60a1db" /> <!-- 10時 -->
      <rect x="550"  y="0" width="50" height="630" fill="#6badec" /> <!-- 11時 -->
      <rect x="600"  y="0" width="50" height="630" fill="#74b5f2" /> <!-- 12時 -->
      <rect x="650"  y="0" width="50" height="630" fill="#6badec" /> <!-- 13時 -->
      <rect x="700"  y="0" width="50" height="630" fill="#5ea1db" /> <!-- 14時 -->
      <rect x="750"  y="0" width="50" height="630" fill="#5292c9" /> <!-- 15時 -->
      <rect x="800"  y="0" width="50" height="630" fill="#768ca8" /> <!-- 16時 -->
      <rect x="850"  y="0" width="50" height="630" fill="#d9845b" /> <!-- 17時 -->
      <rect x="900"  y="0" width="50" height="630" fill="#9c5d75" /> <!-- 18時 -->
      <rect x="950"  y="0" width="50" height="630" fill="#58486e" /> <!-- 19時 -->
      <rect x="1000" y="0" width="50" height="630" fill="#353e57" /> <!-- 20時 -->
      <rect x="1050" y="0" width="50" height="630" fill="#252d3d" /> <!-- 21時 -->
      <rect x="1100" y="0" width="50" height="630" fill="#1e2532" /> <!-- 22時 -->
      <rect x="1150" y="0" width="50" height="630" fill="#191f2a" /> <!-- 23時 -->
    </g>


    <!-- =========================================================================
         2. 左側（深夜）: クレーター付きの明るい満月
         ========================================================================= -->
    <g transform="translate(150, 145)" filter="url(#softShadow)">
      <!-- 月の外縁ハイライト -->
      <circle cx="0" cy="0" r="68" fill="#ffffff" />
      <!-- 月の本体 -->
      <circle cx="2" cy="2" r="66" fill="url(#moonBody)" />

      <!-- クレーター1（左下・大） -->
      <circle cx="-16" cy="15" r="20" fill="#9aa5b8" />
      <circle cx="-14" cy="17" r="18.5" fill="#b0bacb" />

      <!-- クレーター2（上・中） -->
      <circle cx="7" cy="-24" r="12" fill="#9aa5b8" />
      <circle cx="8" cy="-23" r="10.8" fill="#b0bacb" />

      <!-- クレーター3（右下・中） -->
      <circle cx="27" cy="19" r="14" fill="#9aa5b8" />
      <circle cx="28" cy="20" r="12.5" fill="#b0bacb" />
    </g>


    <!-- =========================================================================
         3. 中央（昼）: 明るい黄色の太陽 ＋ 上部のコンパクトな2層雲
         ========================================================================= -->
    <!-- 太陽 -->
    <g transform="translate(600, 140)" filter="url(#softShadow)">
      <!-- 太陽の外縁ハイライト -->
      <circle cx="0" cy="0" r="72" fill="#fffb9e" />
      <!-- 太陽の本体 -->
      <circle cx="2" cy="2" r="70" fill="url(#sunBody)" />
    </g>

    <!-- 上部に配置した小さな2層モコモコ雲（太陽の右下付近にアイコン風に重ねる） -->
    <g transform="translate(640, 155)">
      <!-- 奥の雲（半透明の淡い水色ホワイト） -->
      <g fill="#b8dffb" opacity="0.75">
        <circle cx="22"  cy="42" r="24" />
        <circle cx="52"  cy="28" r="30" />
        <circle cx="88"  cy="22" r="34" />
        <circle cx="122" cy="34" r="26" />
        <rect   x="22"   y="34" width="100" height="26" rx="13" />
      </g>
      <!-- 手前の雲（くっきり明るいホワイト） -->
      <g fill="#f8fcff" filter="url(#cloudShadow)">
        <circle cx="12"  cy="50" r="20" />
        <circle cx="40"  cy="38" r="26" />
        <circle cx="74"  cy="32" r="30" />
        <circle cx="108" cy="40" r="24" />
        <circle cx="132" cy="50" r="18" />
        <rect   x="12"   y="40" width="120" height="28" rx="14" />
      </g>
    </g>


    <!-- =========================================================================
         4. 右側（夜）: キラキラ輝く4つ角スターと星々
         ========================================================================= -->
    <g fill="#ffffff">
      <!-- 大きな4つ角スター 1 -->
      <path d="M 1055,95 Q 1055,117 1077,117 Q 1055,117 1055,139 Q 1055,117 1033,117 Q 1055,117 1055,95 Z" />

      <!-- 大きな4つ角スター 2 -->
      <path d="M 985,160 Q 985,178 1003,178 Q 985,178 985,196 Q 985,178 967,178 Q 985,178 985,160 Z" />

      <!-- 中くらいの4つ角スター 3 -->
      <path d="M 1125,185 Q 1125,199 1139,199 Q 1125,199 1125,213 Q 1125,199 1111,199 Q 1125,199 1125,185 Z" />

      <!-- 小さなダイヤ星 4 -->
      <path d="M 1035,230 Q 1035,240 1045,240 Q 1035,240 1035,250 Q 1035,240 1025,240 Q 1035,240 1035,230 Z" opacity="0.9" />

      <!-- 丸い小さな星々（右側） -->
      <circle cx="1005" cy="105" r="4.5" opacity="0.95" />
      <circle cx="1135" cy="125" r="5"   opacity="0.9" />
      <circle cx="1065" cy="180" r="3.5" opacity="0.85" />
      <circle cx="1095" cy="245" r="4"   opacity="0.85" />
      <circle cx="1160" cy="230" r="3"   opacity="0.75" />

      <!-- 左側（月の周り）にも控えめにきらめく星を配置 -->
      <path d="M 235,85 Q 235,97 247,97 Q 235,97 235,109 Q 235,97 223,97 Q 235,97 235,85 Z" opacity="0.9" />
      <circle cx="55"  cy="95"  r="4"   opacity="0.85" />
      <circle cx="70"  cy="215" r="4"   opacity="0.8" />
      <circle cx="225" cy="205" r="3.5" opacity="0.75" />
    </g>
  </g>
</svg>
