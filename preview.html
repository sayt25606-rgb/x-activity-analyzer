<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OGP SVG プレビュー</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #030712;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 20px;
      color: #94a3b8;
    }
    .preview-card {
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid #1e293b;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <h1>X Card (1200 x 630 px) プレビュー</h1>
  <div class="preview-card">
    <img src="preview-og.svg" alt="OGP Preview">
  </div>
</body>
</html>
